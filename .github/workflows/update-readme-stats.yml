name: Update Inbox Janitor README Stats

on:
  schedule:
    # Runs every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  id-token: write # Mandatory for OIDC token request
  contents: read

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install boto3

      - name: Query GSI & Generate Badge JSON
        run: |
          python - << 'EOF'
          import json
          import os
          import re
          import boto3

          dynamodb = boto3.resource('dynamodb', region_name='us-east-1')
          rules_table = dynamodb.Table('inbox-janitor-active-routing-rules-tf')

          # 1. Fetch Global Total ($O(1) GetItem)
          resp_global = rules_table.get_item(Key={'sender_address': '__GLOBAL_METRICS__'})
          total_trashed = resp_global.get('Item', {}).get('total_trashed', 0)

          # 2. Fetch Top Senders ($O(1) GSI Query)
          gsi_resp = rules_table.query(
              IndexName='TopTrashedSendersIndex',
              KeyConditionExpression='entity_type = :et',
              ExpressionAttributeValues={':et': 'RULE'},
              ScanIndexForward=False,
              Limit=5,
          )
          top_senders = gsi_resp.get('Items', [])

          # 3. Format Shields.io Endpoint JSON
          badge_data = {
              'schemaVersion': 1,
              'label': 'Emails Trashed',
              'message': str(total_trashed),
              'color': 'blue',
          }

          with open('total_badge.json', 'w') as f:
            json.dump(badge_data, f)

          # 4. Generate Top 5 Markdown Table
          table_lines = [
              '| Rank | Sender Address | Trashed Count |',
              '| :--- | :--- | :--- |',
          ]
          for idx, item in enumerate(top_senders, 1):
            sender = item.get('sender_address', 'unknown')
            count = item.get('trashed_count', 0)
            table_lines.append(f'| {idx} | `{sender}` | {count} |')

          table_md = '\n'.join(table_lines)

          # 5. Inject dynamic table into README between markers
          with open('README.md', 'r') as f:
            readme_content = f.read()

          marker_pattern = r'(<!-- TOP_SENDERS_START -->)(.*?)(<!-- TOP_SENDERS_END -->)'
          updated_readme = re.sub(
              marker_pattern,
              f'\\1\n{table_md}\n\\3',
              readme_content,
              flags=re.DOTALL,
          )

          with open('README.md', 'w') as f:
            f.write(updated_readme)
          EOF

      - name: Push Badge to Gist via GitHub API
        env:
          GIST_PAT: ${{ secrets.GIST_PAT }}
          GIST_ID: ${{ secrets.STATS_GIST_ID }}
        run: |
          # Read raw JSON content from python step
          BADGE_CONTENT=$(cat total_badge.json)
          
          # Construct JSON payload for GitHub Gist PATCH API
          PAYLOAD=$(jq -n --arg content "$BADGE_CONTENT" '{files: {"total_badge.json": {content: $content}}}')

          # Send PATCH request directly to GitHub REST API
          curl -s -X PATCH \
            -H "Authorization: Bearer $GIST_PAT" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/gists/$GIST_ID \
            -d "$PAYLOAD"