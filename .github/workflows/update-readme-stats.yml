name: Update Inbox Janitor Stats

on:
  schedule:
    # Runs every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  id-token: write # Mandatory for OIDC token request
  contents: write # Mandatory to commit updated STATS.md back to repo

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIST_PAT }}

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install boto3

      - name: Query Global Metrics & Generate Single Stats JSON
        run: |
          python - << 'EOF'
          import json
          import os
          import boto3
          from datetime import datetime, timezone

          dynamodb = boto3.resource('dynamodb', region_name='us-east-1')
          rules_table = dynamodb.Table('inbox-janitor-multitenant-rules-tf')

          # Fetch Global Metrics using PK/SK composite keys
          resp_global = rules_table.get_item(Key={'PK': 'GLOBAL', 'SK': 'METRICS'})
          item = resp_global.get('Item', {})
          
          total_trashed = int(item.get('total_trashed', 0))
          total_incoming = int(item.get('total_incoming_emails', 0))
          total_bytes = int(item.get('total_bytes_trashed', 0))

          # Dynamic volume-based Clutter Index calculation
          if total_incoming > 0:
              clutter_pct = (total_trashed / total_incoming) * 100
              clutter_index_display = f"{clutter_pct:.1f}%"
          else:
              clutter_index_display = "0.0%"

          # Format storage display
          if total_bytes >= 1073741824:
              storage_display = f"{total_bytes / 1073741824:.2f} GB"
          else:
              storage_display = f"{total_bytes / 1048576:.1f} MB"

          # Generate current UTC timestamp (e.g., "Nov 01, 06:15 UTC")
          last_updated = datetime.now(timezone.utc).strftime("%b %d, %H:%M UTC")

          # Single flat payload for Shields.io dynamic JSON queries
          stats_payload = {
              'total_trashed': f"{total_trashed:,}",
              'total_incoming': f"{total_incoming:,}",
              'clutter_index': clutter_index_display,
              'space_recovered': storage_display,
              'last_updated': last_updated
          }

          with open('stats.json', 'w') as f:
              json.dump(stats_payload, f)
          EOF

      - name: Push Unified JSON to Gist & Purge Legacy Files via GitHub API
        env:
          GIST_PAT: ${{ secrets.GIST_PAT }}
          GIST_ID: ${{ secrets.STATS_GIST_ID }}
        run: |
          STATS_CONTENT=$(cat stats.json)

          # Updates stats.json while explicitly sending null to delete legacy files from Gist
          PAYLOAD=$(jq -n \
            --arg stats "$STATS_CONTENT" \
            '{files: {
              "stats.json": {content: $stats},
              "total_badge.json": null,
              "storage_badge.json": null
            }}')

          curl -s -X PATCH \
            -H "Authorization: Bearer $GIST_PAT" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/gists/$GIST_ID \
            -d "$PAYLOAD"