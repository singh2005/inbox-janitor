name: Update Inbox Janitor Stats

on:
  schedule:
    # Runs every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  id-token: write # Mandatory for OIDC token request
  contents: write # Mandatory to commit updated STATS.md back to repo

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIST_PAT }}

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install boto3

      - name: Query Global Metrics & Update Badge Data
        run: |
          python - << 'EOF'
          import json
          import os
          import boto3

          dynamodb = boto3.resource('dynamodb', region_name='us-east-1')
          rules_table = dynamodb.Table('inbox-janitor-active-routing-rules-tf')

          # 1. Fetch Global Total ($O(1) GetItem)
          resp_global = rules_table.get_item(Key={'sender_address': '__GLOBAL_METRICS__'})
          item = resp_global.get('Item', {})
          total_trashed = item.get('total_trashed', 0)

          # 2. Format Shields.io Total Badge JSON
          badge_data = {
              'schemaVersion': 1,
              'label': 'Emails Trashed',
              'message': str(total_trashed),
              'color': 'blue',
          }
          with open('total_badge.json', 'w') as f:
            json.dump(badge_data, f)
          EOF

      - name: Push JSON Badge to Gist via GitHub API
        env:
          GIST_PAT: ${{ secrets.GIST_PAT }}
          GIST_ID: ${{ secrets.STATS_GIST_ID }}
        run: |
          BADGE_CONTENT=$(cat total_badge.json)

          PAYLOAD=$(jq -n \
            --arg badge "$BADGE_CONTENT" \
            '{files: {"total_badge.json": {content: $badge}}}')

          curl -s -X PATCH \
            -H "Authorization: Bearer $GIST_PAT" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/gists/$GIST_ID \
            -d "$PAYLOAD"