name: "Terraform Plan"

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'

permissions:
  id-token: write      # Grants permission to request OIDC JWT token
  contents: read
  pull-requests: write # MANDATORY: Allows GitHub Actions to post comments on PRs

jobs:
  plan:
    name: "Terraform Plan"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Configure GCP Credentials via OIDC
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}          

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.5.0

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Plan
        id: plan
        env:
          TF_VAR_gcp_project_id: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          terraform plan -input=false -no-color -out=tfplan
          terraform show -no-color tfplan > plan_output.txt

      - name: Post Plan Comment on PR
        uses: actions/github-script@v8
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = './terraform/plan_output.txt';
            let planText = '';

            try {
              planText = fs.readFileSync(path, 'utf8');
            } catch (err) {
              planText = 'Error reading plan output.';
            }

            // Extract summary statistics (e.g., "Plan: 2 to add, 0 to change, 0 to destroy.")
            const summaryMatch = planText.match(/Plan:\s+(\d+)\s+to add,\s+(\d+)\s+to change,\s+(\d+)\s+to destroy/);
            const toAdd = summaryMatch ? summaryMatch[1] : '0';
            const toChange = summaryMatch ? summaryMatch[2] : '0';
            const toDestroy = summaryMatch ? summaryMatch[3] : '0';

            // Extract resource addresses (e.g., "aws_dynamodb_table.raw_email_logs")
            const resourceMatches = [...planText.matchAll(/#\s+([a-zA-Z0-9_.-]+)\s+will be (created|updated in-place|destroyed)/g)];
            
            let resourceRows = '';
            if (resourceMatches.length > 0) {
              resourceRows = resourceMatches.map(m => `| \`${m[1]}\` | **${m[2].toUpperCase()}** |`).join('\n');
            } else {
              resourceRows = '| *No resource changes detected* | - |';
            }

            const output = `### 🚀 Terraform Plan Results

            | Action | Count |
            | :--- | :--- |
            | 🟢 **To Add** | **${toAdd}** |
            | 🟡 **To Change** | **${toChange}** |
            | 🔴 **To Destroy** | **${toDestroy}** |

            <details>
            <summary><b>View Itemized Resource Changes</b></summary>

            | Resource Address | Operation |
            | :--- | :--- |
            ${resourceRows}

            </details>

            <details>
            <summary><b>View Raw Terraform Plan Execution</b></summary>

            \`\`\`hcl
            ${planText.substring(0, 60000)}
            \`\`\`

            </details>

            *Pushed by: @${{ github.actor }} in commit \`${{ github.sha }}\`*`;

            // Search for existing bot comment to update instead of creating duplicates
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c => c.body.includes('🚀 Terraform Plan Results'));

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: output,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: output,
              });
            }